[project]
name = "marketlens"
version = "0.1.0"
description = "AI research assistant for NSE-listed stocks (explain-only, no trading)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "yfinance>=0.2.48",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
